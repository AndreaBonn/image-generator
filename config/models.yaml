    # textures)" file survives in this third-party repo. Its sha256 matches the one
    # CivArchive records for the Civitai upload (model 573152, version 1569593), checked
    # 2026-10-13. Saved under a neutral name so the workflow does not depend on the version.
    filename: lustifySDXL.safetensors
