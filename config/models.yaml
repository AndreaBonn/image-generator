---
# Model registry.
# All files live in MODELS_DIR/<folder>. `source: huggingface` entries are downloaded
# by scripts/install_models.py. Entries with `fooocus_migratable: true` can also be
# picked up once from an existing Fooocus install by scripts/migrate_from_fooocus.py,
# as a shortcut that skips the download (they are never removed by that script).
# Local sizes and sha256 were measured by the user; HF metadata is from 2026-10-04.
models:
  - id: juggernaut_xl_v8
    label: Juggernaut XL v8
    family: sdxl
    folder: checkpoints
    filename: juggernautXL_v8Rundiffusion.safetensors
