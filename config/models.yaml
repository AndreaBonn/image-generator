    size_bytes: 7105348592
    sha256: aeb7e9e6897a1e58b10494bd989d001e3d4bc9b634633cd7b559838f612c2867
    license: "RunDiffusion, da verificare prima di un uso commerciale"

  - id: lustify_sdxl
    label: Lustify SDXL (OLT)
    family: sdxl_libero
    folder: checkpoints
