tasks:
  - &sdxl
    id: bozza
    label: Bozza veloce
    description: Prova rapidamente un'idea prima di rifinire i dettagli.
    duration_hint: circa 4 s
    group: crea
    family: sdxl
    workflow: sdxl_lightning_txt2img.json
    model_ids: [juggernaut_xl_v8, sdxl_lightning_lora]
    bindings: &sdxl_bindings
      prompt: ['@prompt_pos.text']
      negative_prompt: ['@prompt_neg.text']
      seed: ['@sampler.seed']
      steps: ['@sampler.steps']
      cfg: ['@sampler.cfg']
      width: ['@latent.width']
      height: ['@latent.height']
      batch: ['@latent.batch_size']
    defaults: &sdxl_defaults
      prompt: ''
      negative_prompt: ''
      steps: 4
      cfg: 1.0
      seed: null
      batch: 1
      aspect_ratio: '1152*896'
    limits: &sdxl_limits
      steps: {min: 2, max: 8}
      cfg: {min: 1, max: 2}
      seed: {min: 0, max: 4294967295}
      batch: {min: 1, max: 4}
    aspect_ratios: &ratios
      - {id: '704*1408', width: 704, height: 1408, label: 'Verticale 1:2 · 704×1408', featured: false}
      - {id: '704*1344', width: 704, height: 1344, label: 'Verticale 1:2 · 704×1344', featured: false}
      - {id: '768*1344', width: 768, height: 1344, label: 'Verticale 9:16 · 768×1344', featured: true}
      - {id: '768*1280', width: 768, height: 1280, label: 'Verticale 9:16 · 768×1280', featured: false}
      - {id: '832*1216', width: 832, height: 1216, label: 'Verticale 2:3 · 832×1216', featured: false}
      - {id: '832*1152', width: 832, height: 1152, label: 'Verticale 3:4 · 832×1152', featured: false}
      - {id: '896*1152', width: 896, height: 1152, label: 'Verticale 4:5 · 896×1152', featured: true}
      - {id: '896*1088', width: 896, height: 1088, label: 'Verticale 4:5 · 896×1088', featured: false}
      - {id: '960*1088', width: 960, height: 1088, label: 'Verticale 4:5 · 960×1088', featured: false}
      - {id: '960*1024', width: 960, height: 1024, label: 'Verticale 1:1 · 960×1024', featured: false}
      - {id: '1024*1024', width: 1024, height: 1024, label: 'Quadrato 1:1 · 1024×1024', featured: true}
      - {id: '1024*960', width: 1024, height: 960, label: 'Orizzontale 1:1 · 1024×960', featured: false}
      - {id: '1088*960', width: 1088, height: 960, label: 'Orizzontale 5:4 · 1088×960', featured: false}
      - {id: '1088*896', width: 1088, height: 896, label: 'Orizzontale 5:4 · 1088×896', featured: false}
      - {id: '1152*896', width: 1152, height: 896, label: 'Orizzontale 5:4 · 1152×896', featured: true}
      - {id: '1152*832', width: 1152, height: 832, label: 'Orizzontale 4:3 · 1152×832', featured: false}
      - {id: '1216*832', width: 1216, height: 832, label: 'Orizzontale 3:2 · 1216×832', featured: true}
      - {id: '1280*768', width: 1280, height: 768, label: 'Orizzontale 16:9 · 1280×768', featured: false}
      - {id: '1344*768', width: 1344, height: 768, label: 'Orizzontale 16:9 · 1344×768', featured: true}
      - {id: '1344*704', width: 1344, height: 704, label: 'Orizzontale 2:1 · 1344×704', featured: false}
      - {id: '1408*704', width: 1408, height: 704, label: 'Orizzontale 2:1 · 1408×704', featured: false}
      - {id: '1472*704', width: 1472, height: 704, label: 'Orizzontale 2:1 · 1472×704', featured: false}
      - {id: '1536*640', width: 1536, height: 640, label: 'Orizzontale 21:9 · 1536×640', featured: false}
      - {id: '1600*640', width: 1600, height: 640, label: 'Orizzontale 21:9 · 1600×640', featured: false}
      - {id: '1664*576', width: 1664, height: 576, label: 'Orizzontale 3:1 · 1664×576', featured: false}
      - {id: '1728*576', width: 1728, height: 576, label: 'Orizzontale 3:1 · 1728×576', featured: false}
    supports_styles: true
    supports_negative: true
    default_styles: []
    prompt_language: &english
      required: en
      label: Scrivi in inglese
      reason: >-
        Questo modello è stato addestrato su testi inglesi:
        in italiano coglie il soggetto ma perde molti dettagli.
    prompt_tips:
      - Descrivi soggetto, ambiente, luce e stile, in quest'ordine.
      - Frasi brevi separate da virgole bastano per provare un'idea.
    prompt_examples:
      - 'red bicycle beside a stone wall, watercolor'
      - 'a small wooden cabin beside a mountain lake, morning mist, soft golden light, wide landscape photograph'

  - <<: *sdxl
    id: qualita
    label: Immagine di qualità
    description: Crea immagini curate con dettagli e stili personalizzabili.
    duration_hint: circa 30 s
    workflow: sdxl_txt2img.json
    model_ids: [juggernaut_xl_v8, sdxl_offset_lora]
    defaults: &quality_defaults
      <<: *sdxl_defaults
      steps: 30
      cfg: 4.0
    limits: &quality_limits
      <<: *sdxl_limits
      steps: {min: 10, max: 60}
      cfg: {min: 1, max: 10}
    default_styles: [Fooocus Enhance, Fooocus Sharp]
    prompt_tips:
      - Indica soggetto, materiali, luce e inquadratura.
      - Se serve, aggiungi un obiettivo fotografico o uno stile di illustrazione.
    prompt_examples:
      - 'portrait of an old fisherman, weathered face, golden hour, 85mm photo'
      - 'cozy reading corner, wooden shelves, rain on the window, soft warm light, detailed illustration'

  - <<: *sdxl
    id: libero
    label: Creazione libera
    description: Qualsiasi soggetto, la descrizione viene eseguita così com'è senza filtri aggiunti.
    duration_hint: null
    family: sdxl_libero
    workflow: sdxl_libero_txt2img.json
    model_ids: [lustify_sdxl, sdxl_offset_lora]
    defaults: *quality_defaults
    limits: *quality_limits
    default_styles: []
    prompt_tips:
      - Descrivi la scena per esteso, il modello segue il testo alla lettera.
      - Nessuno stile è attivo di default, così il risultato dipende solo dal testo.
    prompt_examples:
      - 'candid photo of a woman laughing on a rooftop at night, city lights, 35mm film'
      - 'dramatic studio portrait of a dancer mid-jump, hard rim light, black background'

  - &flux
    <<: *sdxl
    id: testo
    label: Scritte nell'immagine e scene complesse
    description: Componi scene articolate e immagini con brevi scritte.
    duration_hint: circa 9 s
    family: flux2_klein
    workflow: flux2_klein_txt2img.json
    model_ids: [flux2_klein_4b, qwen3_4b_fp4, flux2_vae]
    bindings:
      prompt: ['@prompt_pos.text']
      seed: ['@noise.noise_seed']
      steps: ['@scheduler.steps']
      cfg: ['@guider.cfg']
      width: ['@latent.width', '@scheduler.width']
      height: ['@latent.height', '@scheduler.height']
      batch: ['@latent.batch_size']
    defaults: {prompt: '', steps: 4, cfg: 1.0, seed: null, batch: 1, aspect_ratio: '1152*896'}
    limits:
      <<: *sdxl_limits
      steps: {min: 4, max: 8}
      cfg: {min: 1, max: 1.5}
    supports_styles: false
    supports_negative: false
    prompt_language:
      required: any
      label: Italiano o inglese
      reason: Questo modello capisce bene sia l'italiano sia l'inglese.
    prompt_tips:
      - Metti fra virgolette il testo esatto da scrivere nell'immagine.
      - Descrivi dove si trova ogni oggetto e come si collegano fra loro.
    prompt_examples:
      - 'A bakery sign reading "FRESH BREAD", clean bold lettering.'
      - 'A red mug to the left of a blue book on a wooden desk, a small plant behind the book, soft window light.'

  - <<: *sdxl
    id: foto
    label: Foto realistica
    description: Realizza fotografie naturali e credibili, anche di persone.
    duration_hint: circa 17 s
    family: zimage
    workflow: zimage_txt2img.json
    model_ids: [zimage_turbo, zimage_vae, qwen3_4b_fp4]
    bindings:
      prompt: ['@prompt_pos.text']
      seed: ['@sampler.seed']
      steps: ['@sampler.steps']
      cfg: ['@sampler.cfg']
      width: ['@latent.width']
      height: ['@latent.height']
      batch: ['@latent.batch_size']
    defaults: {prompt: '', steps: 8, cfg: 1.0, seed: null, batch: 1, aspect_ratio: '1152*896'}
    limits:
      <<: *sdxl_limits
      steps: {min: 6, max: 12}
      cfg: {min: 1, max: 1.5}
    supports_styles: false
    supports_negative: false
    prompt_language:
      required: any
      label: Italiano o inglese
      reason: Questo modello capisce bene sia l'italiano sia l'inglese.
    prompt_tips:
      - Descrivi la luce, la distanza dal soggetto e il soggetto principale.
      - Usa dettagli concreti su materiali e ambiente.
    prompt_examples:
      - 'a ceramic cup on a linen tablecloth, natural window light, photograph'
      - >-
        candid portrait of a gardener in a greenhouse, soil on hands, backlit leaves,
        shallow depth of field, documentary photography

  - <<: *flux
    id: da_schizzo
    label: Dallo schizzo
    description: >-
      Trasforma uno schizzo in un'immagine finita, con un secondo riferimento
      opzionale per lo stile o il soggetto.
    duration_hint: circa 15 s
    workflow: null
    workflow_by_reference_count:
      1: flux2_klein_refs_1.json
      2: flux2_klein_refs_2.json
    reference_labels: [Schizzo, Stile o soggetto]
    prompt_prefix: >-
      Turn the first reference sketch into a finished image, following its
      composition and outlines exactly.
    bindings:
      prompt: ['@prompt_pos.text']
      seed: ['@noise.noise_seed']
      steps: ['@scheduler.steps']
      cfg: ['@guider.cfg']
      width: ['@latent.width', '@scheduler.width']
      height: ['@latent.height', '@scheduler.height']
      batch: ['@latent.batch_size']
    defaults: {prompt: '', steps: 4, cfg: 1.0, seed: null, batch: 1, aspect_ratio: '1152*896'}
    limits:
      <<: *sdxl_limits
      steps: {min: 4, max: 8}
      cfg: {min: 1, max: 1.5}
    supports_styles: false
    supports_negative: false
    prompt_language:
      required: any
      label: Italiano o inglese
      reason: Questo modello capisce bene sia l'italiano sia l'inglese.
    prompt_tips:
      - "Descrivi la scena finita: ambiente, luce, materiali."
      - "Non serve ridescrivere ciò che lo schizzo mostra già: forma e composizione arrivano dal riferimento."
    prompt_examples:
      - Una casa di legno in una radura innevata, luce calda alle finestre, sera.
      - Un vaso di ceramica blu su un tavolo di marmo, luce naturale da sinistra.

  - <<: *flux
    id: in_posa
    label: In posa
    description: "Applica la posa del primo riferimento al personaggio del secondo."
    duration_hint: circa 25 s
    workflow: null
    workflow_by_reference_count:
      1: flux2_klein_refs_1.json
      2: flux2_klein_refs_2.json
    min_references: 2
    reference_labels: [Posa, Personaggio]
    prompt_prefix: >-
      Show the character from the second reference in exactly the body pose
      of the first reference.
    bindings:
      prompt: ['@prompt_pos.text']
      seed: ['@noise.noise_seed']
      steps: ['@scheduler.steps']
      cfg: ['@guider.cfg']
      width: ['@latent.width', '@scheduler.width']
      height: ['@latent.height', '@scheduler.height']
      batch: ['@latent.batch_size']
    defaults: {prompt: '', steps: 4, cfg: 1.0, seed: null, batch: 1, aspect_ratio: '1152*896'}
    limits:
      <<: *sdxl_limits
      steps: {min: 4, max: 8}
      cfg: {min: 1, max: 1.5}
    supports_styles: false
    supports_negative: false
    prompt_language:
      required: any
      label: Italiano o inglese
      reason: Questo modello capisce bene sia l'italiano sia l'inglese.
    prompt_tips:
      - "Descrivi l'ambientazione della nuova scena: dove si trova il personaggio, la luce, lo stile."
      - "La posa arriva dal primo riferimento, l'aspetto del personaggio dal secondo: non serve ripeterli nella descrizione."
    prompt_examples:
      - In una palestra illuminata al neon, stile fotografico.
      - Su un palcoscenico teatrale, controluce drammatico, illustrazione pittorica.

  - <<: *flux
    id: crea_da_riferimenti
    label: Crea dai riferimenti
    description: "Mantieni lo stesso soggetto o personaggio in una scena nuova, da 1 a 3 immagini di riferimento."
    duration_hint: 17-52 s
    workflow: null
    workflow_by_reference_count:
      1: flux2_klein_refs_1.json
      2: flux2_klein_refs_2.json
      3: flux2_klein_refs_3.json
    bindings:
      prompt: ['@prompt_pos.text']
      seed: ['@noise.noise_seed']
      steps: ['@scheduler.steps']
      cfg: ['@guider.cfg']
      width: ['@latent.width', '@scheduler.width']
      height: ['@latent.height', '@scheduler.height']
      batch: ['@latent.batch_size']
    defaults: {prompt: '', steps: 4, cfg: 1.0, seed: null, batch: 1, aspect_ratio: '1152*896'}
    limits:
      <<: *sdxl_limits
      steps: {min: 4, max: 8}
      cfg: {min: 1, max: 1.5}
    supports_styles: false
    supports_negative: false
    prompt_language:
      required: any
      label: Italiano o inglese
      reason: Questo modello capisce bene sia l'italiano sia l'inglese.
    prompt_tips:
      - "Descrivi la scena nuova: dove si trova il soggetto, cosa fa, la luce."
      - "I riferimenti portano già il soggetto o il personaggio: non serve ripeterne l'aspetto nella descrizione."
    prompt_examples:
      - La persona delle foto seduta in un caffè di Parigi, luce del mattino.
      - Il personaggio delle immagini in piedi su una scogliera al tramonto, vento tra i capelli.

  - <<: *sdxl
    id: inpaint
    label: Modifica una parte
    description: Ridisegna la zona selezionata mantenendo il resto dell'immagine.
    duration_hint: circa 30 s
    group: modifica
    workflow: sdxl_inpaint.json
    model_ids: &inpaint_models [juggernaut_xl_v8, sdxl_offset_lora, fooocus_inpaint_head, fooocus_inpaint_patch]
    bindings:
      prompt: ['@prompt_pos.text']
      negative_prompt: ['@prompt_neg.text']
      seed: ['@sampler.seed']
      steps: ['@sampler.steps']
      cfg: ['@sampler.cfg']
      input_image: ['@input_image.image']
      input_mask: ['@input_mask.image']
    defaults: {<<: *quality_defaults, denoise: 1.0, mask_expansion: 8}
    limits: {<<: *quality_limits, denoise: {min: 0, max: 1}, mask_expansion: {min: 0, max: 64}}
    prompt_tips:
      - Descrivi solo ciò che deve comparire nella zona colorata.
      - Richiama la luce e lo stile del resto dell'immagine.
    prompt_examples:
      - 'a red wool scarf'
      - 'a small vase of white daisies on the table, soft light from the left, realistic photograph'

  - <<: *sdxl
    id: outpaint
    label: Allarga l'immagine
    description: Estendi la scena oltre i bordi dell'immagine originale.
    duration_hint: circa 30 s
    group: modifica
    workflow: sdxl_outpaint.json
    model_ids: *inpaint_models
    bindings:
      prompt: ['@prompt_pos.text']
      negative_prompt: ['@prompt_neg.text']
      seed: ['@sampler.seed']
      steps: ['@sampler.steps']
      cfg: ['@sampler.cfg']
      input_image: ['@input_image.image']
      pad_left: ['@pad.left']
      pad_top: ['@pad.top']
      pad_right: ['@pad.right']
      pad_bottom: ['@pad.bottom']
    defaults: {<<: *quality_defaults, denoise: 1.0, expansion: 0.3}
    limits: {<<: *quality_limits, denoise: {min: 0, max: 1}, expansion: {min: 0.1, max: 1}}
    prompt_tips:
      - Descrivi come deve continuare la scena oltre i bordi.
      - "Puoi lasciare vuota la descrizione: la scena esistente guida l'allargamento."
    prompt_examples:
      - 'rolling hills and a clear blue sky'
      - 'the forest path continues between tall pine trees, scattered autumn leaves, matching warm evening light'

  - &variation
    <<: *sdxl
    id: variazione_sottile
    label: Variazione leggera
    description: Introduci piccoli cambiamenti conservando la composizione.
    duration_hint: 15-30 s
    group: migliora
    workflow: sdxl_img2img.json
    model_ids: [juggernaut_xl_v8, sdxl_offset_lora]
    bindings:
      prompt: ['@prompt_pos.text']
      negative_prompt: ['@prompt_neg.text']
      seed: ['@sampler.seed']
      steps: ['@sampler.steps']
      cfg: ['@sampler.cfg']
      input_image: ['@input_image.image']
      width: ['@resize.width']
      height: ['@resize.height']
      denoise: ['@sampler.denoise']
    defaults: {<<: *quality_defaults, denoise: 0.5}
    limits: {<<: *quality_limits, denoise: {min: 0, max: 1}}
    prompt_tips:
      - Indica solo i dettagli da cambiare.
      - "Puoi lasciare vuota la descrizione: la variazione segue l'immagine originale."
    prompt_examples:
      - 'slightly warmer afternoon light'
      - 'the same quiet garden, a few more yellow flowers, gentle sunlight, natural colors'

  - <<: *variation
    id: variazione_forte
    label: Variazione forte
    description: Reinterpreta l'immagine con cambiamenti più marcati.
    duration_hint: 15-30 s
    defaults: {<<: *quality_defaults, denoise: 0.85}
    prompt_tips:
      - Descrivi l'atmosfera, lo stile o l'ambiente nuovi da provare.
      - Ripeti qualche dettaglio del soggetto per restare vicino all'originale.
    prompt_examples:
      - 'the city at night, neon lights, cinematic mood'
      - 'reinterpret the stone cottage as a colorful storybook illustration, oversized flowers, bright morning sky'
  - &upscale
    id: upscale
    label: Ingrandisci
    description: Aumenta la risoluzione dell'immagine di due o quattro volte.
    duration_hint: pochi secondi
    group: migliora
    family: upscale
    workflow: upscale.json
    model_ids: [ultrasharp_4x]
    bindings:
      input_image: ['@input_image.image']
      scale: ['@scale.scale_by']
    defaults: {upscale_factor: 2}
    limits: {upscale_factor: {min: 2, max: 4, options: [2, 4]}}
    aspect_ratios: []
    supports_styles: false
    supports_negative: false
    default_styles: []
    prompt_language:
      required: any
      label: Nessuna descrizione necessaria
      reason: Questo compito ingrandisce l'immagine senza bisogno di una descrizione.
    prompt_tips:
      - "Non serve una descrizione: scegli l'immagine e quanto ingrandirla."
      - ×2 dà un'immagine più leggera, ×4 una più grande.
    prompt_examples:
      - 'Upscale a portrait to twice its original size.'
      - 'Enlarge a detailed landscape illustration to four times its original size.'

  - <<: *flux
    id: modifica_libera
    label: Modifica con le parole
    group: modifica
    description: "Descrivi come cambiare l'immagine, anche in italiano."
    duration_hint: null
    workflow: flux2_klein_edit.json
    bindings:
      prompt: ['@prompt_pos.text']
      seed: ['@noise.noise_seed']
      steps: ['@scheduler.steps']
      cfg: ['@guider.cfg']
      input_image: ['@input_image.image']
      width: ['@resize.width', '@latent.width', '@scheduler.width']
      height: ['@resize.height', '@latent.height', '@scheduler.height']
      batch: ['@latent.batch_size']
    prompt_tips:
      - "Descrivi la modifica da applicare all'immagine."
      - Puoi scrivere in italiano o in inglese.
    prompt_examples:
      - Metti il cielo al tramonto.
      - Sostituisci il vaso sul tavolo con una ciotola di ceramica blu, mantenendo la luce e la stanza.

  - <<: *upscale
    id: rimuovi_sfondo
    label: Rimuovi lo sfondo
    description: Isola il soggetto e salva un PNG con lo sfondo trasparente.
    duration_hint: null
    family: background
    workflow: background_removal.json
    model_ids: [birefnet]
    bindings:
      input_image: ['@input_image.image']
    defaults: {batch: 1}
    limits:
      batch: {min: 1, max: 1}
    prompt_language:
      required: any
      label: Nessuna descrizione necessaria
      reason: Il modello riconosce il soggetto senza istruzioni testuali.
    prompt_tips:
      - "Scegli un'immagine con un soggetto distinguibile."
      - Il risultato conserva le dimensioni originali.
    prompt_examples:
      - Isola una persona dal paesaggio.
      - Rimuovi lo sfondo da una foto di un prodotto per riutilizzarlo in una composizione.

  - <<: *variation
    id: ingrandisci_rifinito
    label: Ingrandisci con rifinitura
    description: "Raddoppia le dimensioni di lavoro e rifinisce i dettagli dell'immagine."
    duration_hint: 1-2 minuti
    workflow: sdxl_upscale_refine.json
    model_ids: [juggernaut_xl_v8, sdxl_offset_lora, ultrasharp_4x]
    bindings:
      prompt: ['@prompt_pos.text']
      negative_prompt: ['@prompt_neg.text']
      seed: ['@sampler.seed']
      steps: ['@sampler.steps']
      cfg: ['@sampler.cfg']
      denoise: ['@sampler.denoise']
      input_image: ['@input_image.image']
      width: ['@resize.width', '@merge.final_width']
      height: ['@resize.height', '@merge.final_height']
    defaults:
      <<: *quality_defaults
      steps: 12
      denoise: 0.3
    limits:
      <<: *quality_limits
      steps: {min: 6, max: 30}
      denoise: {min: 0.1, max: 0.5}
      batch: {min: 1, max: 1}
    prompt_tips:
      - "La descrizione è facoltativa: scrivi in inglese i dettagli da rifinire."
      - Una rifinitura più intensa può cambiare piccoli dettagli.
    prompt_examples:
      - sharp fabric texture
      - detailed stone facade, natural daylight, realistic architectural photograph
